name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked
      - name: Test
        run: cargo test --locked
      - name: Test on a Debian system's default files
        # Mostly GPL-licensed, so copied from a debian:trixie container
        # rather than vendored.
        run: |
          tests/debian/fetch.sh "$RUNNER_TEMP/debian"
          SOOTMARK_PERSISTENCE_DEBIAN="$RUNNER_TEMP/debian" cargo test --locked --test debian
      - name: Docs
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build for wasm32
        run: cargo build --locked --target wasm32-unknown-unknown

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
