[package]
name = "sootmark-persistence"
version = "0.4.0"
edition = "2021"
rust-version = "1.80"
description = "Where Linux and Unix attackers keep access: crontabs, at jobs, systemd units, init scripts, SSH authorized keys and sshd_config, rc.local and shell start-up files, ld.so.preload, sudoers, PAM, udev rules, XDG autostart and kernel modules, read into entries with what runs, as whom and when, and what looks suspicious."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/persistence"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response", "linux", "persistence"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "persistence"

[dependencies]
common = { package = "sootmark-common", version = "0.3.7" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
